  .cloud-obstacle {
    position: absolute;
    width: 12%;
    aspect-ratio: 100 / 60;
    z-index: 8;
    filter: drop-shadow(0 4px 6px rgba(80,110,140,0.25));
  }
  .cloud-obstacle svg { width: 100%; height: 100%; display: block; }

  #tree-goal {
    position: absolute;
    width: 12%;
    aspect-ratio: 100 / 140;
    right: 2%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 7;
    filter: drop-shadow(0 5px 6px rgba(60,90,60,0.25));
  }
  #tree-goal svg { width: 100%; height: 100%; display: block; }

  .ctrl-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ctrl-btn {
    width: clamp(34px, 6.5vw, 66px);
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 26%;
    cursor: pointer;
    background: #5fb8e0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
    box-shadow: 0 3px 0 rgba(60, 120, 150, 0.35);
  }
  .ctrl-btn:hover { background: #55acd4; }
  .ctrl-btn:active {
    transform: translateY(2px) scale(0.96);
    box-shadow: 0 1px 0 rgba(60, 120, 150, 0.35);
  }
  .ctrl-btn .arrow-icon {
    width: 52%;
    height: 52%;
    fill: #ffffff;
  }

  #btn-down .arrow-icon  { transform: rotate(180deg); }
  #btn-left .arrow-icon  { transform: rotate(-90deg); }
  #btn-right .arrow-icon { transform: rotate(90deg); }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(120, 150, 180, 0.4);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 40;
    transition: opacity 0.3s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  #bump-feedback {
    position: absolute;
    left: 50%;
    top: 14%;
    transform: translateX(-50%);
    background: #ffffff;
    color: #d3684f;
    font-weight: 700;
    font-size: clamp(14px, 2.4vw, 22px);
    padding: 0.5em 1em;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    z-index: 50;
    opacity: 1;
    transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #bump-feedback.hidden { opacity: 0; }

  .overlay-card {
    background: #ffffff;
    border-radius: 22px;
    padding: clamp(16px, 3vw, 32px) clamp(20px, 4vw, 44px);
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    max-width: 82%;
  }

        <circle cx="74" cy="72" r="26" fill="#8fd98a"></circle>
      </svg>
    </div>

    <div id="bird" style="transform: scaleX(1); left: 1%; top: 40%;"></div>
  <div class="cloud-obstacle" style="left: 8%; top: 60.57%;"><svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg"><ellipse cx="30" cy="40" rx="22" ry="18" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><ellipse cx="55" cy="28" rx="26" ry="22" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><ellipse cx="76" cy="40" rx="18" ry="15" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><rect x="18" y="38" width="64" height="20" fill="#ffffff"></rect></svg></div><div class="cloud-obstacle" style="left: 30%; top: 27.2721%;"><svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg"><ellipse cx="30" cy="40" rx="22" ry="18" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><ellipse cx="55" cy="28" rx="26" ry="22" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><ellipse cx="76" cy="40" rx="18" ry="15" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><rect x="18" y="38" width="64" height="20" fill="#ffffff"></rect></svg></div><div class="cloud-obstacle" style="left: 52%; top: 53.0891%;"><svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg"><ellipse cx="30" cy="40" rx="22" ry="18" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><ellipse cx="55" cy="28" rx="26" ry="22" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><ellipse cx="76" cy="40" rx="18" ry="15" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><rect x="18" y="38" width="64" height="20" fill="#ffffff"></rect></svg></div><div class="cloud-obstacle" style="left: 74%; top: 57.2082%;"><svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg"><ellipse cx="30" cy="40" rx="22" ry="18" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><ellipse cx="55" cy="28" rx="26" ry="22" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><ellipse cx="76" cy="40" rx="18" ry="15" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"></ellipse><rect x="18" y="38" width="64" height="20" fill="#ffffff"></rect></svg></div></div>

  <div id="controls-bar">
    <button class="ctrl-btn" id="btn-left" data-dir="left" aria-label="Izquierda">
      <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"></path></svg>
    </button>
    <div class="ctrl-col">
      <button class="ctrl-btn" id="btn-up" data-dir="up" aria-label="Arriba">
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"></path></svg>
      </button>
      <button class="ctrl-btn" id="btn-down" data-dir="down" aria-label="Abajo">
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"></path></svg>
      </button>
    </div>
    <button class="ctrl-btn" id="btn-right" data-dir="right" aria-label="Derecha">
      <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"></path></svg>
    </button>
  </div>

  <div id="start-screen" class="overlay">
    <div class="overlay-card">
      <div class="overlay-icon"></div>
      <button id="start-btn" class="overlay-btn">Comenzar</button>
    </div>
  </div>

  <div id="bump-feedback" class="hidden">¡Tocaste una nube! Volviste al inicio 🔁</div>

  <div id="win-screen" class="overlay hidden">
    <div class="overlay-card">
      <div class="overlay-icon"></div>
      <h2>¡Lolo llegó a su árbol! 🎉</h2>
      <p>¡Muy bien hecho!</p>
      <button id="play-again-btn" class="overlay-btn">Jugar de nuevo</button>
    </div>
  </div>

</div>

<script>
  const skyArea = document.getElementById('sky-area');
  const bird = document.getElementById('bird');
  const tree = document.getElementById('tree-goal');

  const startScreen = document.getElementById('start-screen');
  const winScreen = document.getElementById('win-screen');
  const bumpFeedback = document.getElementById('bump-feedback');
  const startBtn = document.getElementById('start-btn');
  const playAgainBtn = document.getElementById('play-again-btn');

  const btns = {
    up: document.getElementById('btn-up'),
    down: document.getElementById('btn-down'),
    left: document.getElementById('btn-left'),
    right: document.getElementById('btn-right'),
  };

  // En cada juego nuevo se genera al azar una disposición de 4 nubes
  // [x%, y%], validando geométricamente que: (1) siempre exista un camino
  // libre hasta el árbol, (2) ninguna nube quede sobre el árbol, y
  // (3) el camino obligue a alternar flechas (no sirve una sola dirección).
  const CLOUD_X_COLS = [8, 30, 52, 74];
  const CLOUD_W_PCT = 12;
  const CLOUD_H_PCT = 15.802469135802466; // 12% de ancho con aspect-ratio 100/60
  const BIRD_W_PCT = 16;
  const BIRD_H_PCT = 19.14036143479767;   // 16% de ancho con aspect-ratio 677/369
  const TREE_LEFT = 86, TREE_RIGHT = 98, TREE_TOP = 31.563786008230455, TREE_BOTTOM = 68.43621399176955;
  const MAX_CLOUD_Y = 100 - CLOUD_H_PCT;
  const MIN_MARGIN = 6;   // nunca imposible
  const MAX_MARGIN = 9;   // pero exigente para un chico de 6 años

  function worstGap(ys) {
    const obstacles = CLOUD_X_COLS.map((x, i) => [x, x + CLOUD_W_PCT, ys[i], ys[i] + CLOUD_H_PCT]);
    let worst = Infinity;
    for (let x = 0; x <= 100; x += 0.5) {
      const bx1 = x, bx2 = x + BIRD_W_PCT;
      const bands = obstacles
        .filter(([ox1, ox2]) => ox1 < bx2 && ox2 > bx1)
        .map(([, , oy1, oy2]) => [oy1, oy2])
        .sort((a, b) => a[0] - b[0]);
      const merged = [];
      bands.forEach(([a, b]) => {
        if (merged.length && a <= merged[merged.length - 1][1]) {
          merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], b);
        } else {
          merged.push([a, b]);
        }
      });
      let prev = 0, bestGap = 0;
      merged.forEach(([a, b]) => {
        bestGap = Math.max(bestGap, a - prev);
        prev = Math.max(prev, b);
      });
      bestGap = Math.max(bestGap, 100 - prev);
      worst = Math.min(worst, bestGap);
    }
    return worst;
  }

  function overTree(ys) {
    const x = CLOUD_X_COLS[3];
    if (!(x < TREE_RIGHT && x + CLOUD_W_PCT > TREE_LEFT)) return false;
    const y = ys[3];
    return y < TREE_BOTTOM && y + CLOUD_H_PCT > TREE_TOP;
  }

  function zigzagTransitions(ys) {
    const center = MAX_CLOUD_Y / 2;
    const side = ys.map(y => (y < center ? 'top' : 'bottom'));
    let count = 0;
    for (let i = 1; i < side.length; i++) if (side[i] !== side[i - 1]) count++;
    return count;
  }

  function generateLayout() {
    for (let attempt = 0; attempt < 2000; attempt++) {
      const ys = CLOUD_X_COLS.map(() => Math.random() * MAX_CLOUD_Y);
      if (overTree(ys)) continue;
      if (zigzagTransitions(ys) < 2) continue;
      const margin = worstGap(ys) - BIRD_H_PCT;
      if (margin >= MIN_MARGIN && margin <= MAX_MARGIN) {
        return CLOUD_X_COLS.map((x, i) => [x, ys[i]]);
      }
    }
    // Respaldo verificado por si el azar no encuentra una combinación a tiempo.
    return [[8, 26], [30, 62], [52, 20], [74, 58]];
  }

  const CLOUD_SVG = '<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">' +
    '<ellipse cx="30" cy="40" rx="22" ry="18" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"/>' +
    '<ellipse cx="55" cy="28" rx="26" ry="22" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"/>' +
    '<ellipse cx="76" cy="40" rx="18" ry="15" fill="#ffffff" stroke="#bcd4e6" stroke-width="2"/>' +
    '<rect x="18" y="38" width="64" height="20" fill="#ffffff"/></svg>';

  let clouds = [];

  function renderClouds(layout) {
    document.querySelectorAll('.cloud-obstacle').forEach(el => el.remove());
    layout.forEach(([x, y]) => {
      const div = document.createElement('div');
      div.className = 'cloud-obstacle';
      div.style.left = x + '%';
      div.style.top = y + '%';
      div.innerHTML = CLOUD_SVG;
      skyArea.appendChild(div);
    });
    clouds = Array.from(document.querySelectorAll('.cloud-obstacle'));
  }

  const START_LEFT_PCT = 1;
  const START_TOP_PCT = 40;
  const STEP_PCT = 7;

  let leftPct = START_LEFT_PCT;
  let topPct = START_TOP_PCT;
  let playing = false;

  function setBirdPosition() {
    bird.style.left = leftPct + '%';
    bird.style.top = topPct + '%';
  }

  function resetBird() {
    leftPct = START_LEFT_PCT;
    topPct = START_TOP_PCT;
    bird.style.transform = 'scaleX(1)';
    setBirdPosition();
  }

  function rectsOverlap(a, b, insetRatio) {
    const ax1 = a.left + a.width * insetRatio;
    const ax2 = a.right - a.width * insetRatio;
    const ay1 = a.top + a.height * insetRatio;
    const ay2 = a.bottom - a.height * insetRatio;
    const bx1 = b.left + b.width * insetRatio;
    const bx2 = b.right - b.width * insetRatio;
    const by1 = b.top + b.height * insetRatio;
    const by2 = b.bottom - b.height * insetRatio;
    return ax1 < bx2 && ax2 > bx1 && ay1 < by2 && ay2 > by1;
  }

  let bumpTimeout = null;

  function checkCollisions() {
    if (!playing) return;
    const birdRect = bird.getBoundingClientRect();

    for (const cloud of clouds) {
      const cloudRect = cloud.getBoundingClientRect();
      if (rectsOverlap(birdRect, cloudRect, 0.2)) {
        bumpBack();
        return;
      }
    }

    const treeRect = tree.getBoundingClientRect();
    if (rectsOverlap(birdRect, treeRect, 0.1)) {
      winGame();
    }
  }

  function bumpBack() {
    resetBird();
    bumpFeedback.classList.remove('hidden');
    try { window.parent.postMessage({ tipo: 'juego-fallo' }, '*'); } catch (e) {}
    if (bumpTimeout) clearTimeout(bumpTimeout);
    bumpTimeout = setTimeout(() => bumpFeedback.classList.add('hidden'), 1100);
  }

  function winGame() {
    playing = false;
    winScreen.classList.remove('hidden');
    try { window.parent.postMessage({ tipo: 'lolo-llego' }, '*'); } catch (e) {}
  }

  function move(dir) {
    if (!playing) return;

    const areaRect = skyArea.getBoundingClientRect();
    const birdRect = bird.getBoundingClientRect();
    const birdWidthPct = (birdRect.width / areaRect.width) * 100;
    const birdHeightPct = (birdRect.height / areaRect.height) * 100;
    const maxLeft = 100 - birdWidthPct;
    const maxTop = 100 - birdHeightPct;

    if (dir === 'up') { topPct -= STEP_PCT; bird.style.transform = 'scaleX(1)'; }
    if (dir === 'down') { topPct += STEP_PCT; bird.style.transform = 'scaleX(1)'; }
    if (dir === 'left') { leftPct -= STEP_PCT; bird.style.transform = 'scaleX(-1)'; }
    if (dir === 'right') { leftPct += STEP_PCT; bird.style.transform = 'scaleX(1)'; }

    leftPct = Math.max(0, Math.min(maxLeft, leftPct));
    topPct = Math.max(0, Math.min(maxTop, topPct));

    setBirdPosition();

    setTimeout(checkCollisions, 290);
  }

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': move('up'); e.preventDefault(); break;
      case 'ArrowDown': move('down'); e.preventDefault(); break;
      case 'ArrowLeft': move('left'); e.preventDefault(); break;
      case 'ArrowRight': move('right'); e.preventDefault(); break;
    }
  });

  Object.entries(btns).forEach(([dir, el]) => {
    el.addEventListener('click', () => move(dir));
  });

  const wrapper = document.getElementById('game-wrapper');
  wrapper.setAttribute('tabindex', '0');
  wrapper.addEventListener('click', () => wrapper.focus());

  function startGame() {
    startScreen.classList.add('hidden');
    winScreen.classList.add('hidden');
    bumpFeedback.classList.add('hidden');
    resetBird();
    playing = true;
    wrapper.focus();
  }

  function newGame() {
    renderClouds(generateLayout());
    startGame();
  }

  startBtn.addEventListener('click', newGame);
  playAgainBtn.addEventListener('click', newGame);

  renderClouds(generateLayout());
  resetBird();
</script>
